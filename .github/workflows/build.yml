name: build

on:
  push:
  pull_request:

jobs:
  core:
    name: Protocol core, codecs, service, tests (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and test (build.cmd)
        shell: cmd
        run: build.cmd

  core-arm64:
    name: Protocol core, codecs, service (ARM64 cross)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      # cross-compiles to build_arm64\; the unit tests are skipped by build.cmd
      # because arm64 binaries cannot run on an x64 runner
      - name: Build (build.cmd arm64)
        shell: cmd
        run: build.cmd arm64

  utility:
    name: Settings utility
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet build ui/LdacConfig -c Release
      - name: Publish for win-arm64 (packaging smoke test)
        run: dotnet publish ui/LdacConfig -c Release -r win-arm64 --self-contained false -o build/publish-arm64

  driver:
    name: KMDF driver (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      # The runner image has no WDK; take it (with ACX) from NuGet, see driver/Directory.Build.props.
      - name: Restore the WDK from NuGet
        run: nuget restore driver\packages.config -PackagesDirectory driver\packages
      - name: Build (build_driver.cmd Release x64)
        shell: cmd
        run: build_driver.cmd Release x64

  driver-arm64:
    name: KMDF driver (ARM64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Restore the WDK from NuGet
        run: nuget restore driver\packages.config -PackagesDirectory driver\packages
      - name: Build (build_driver.cmd Release ARM64)
        shell: cmd
        run: build_driver.cmd Release ARM64
      - name: Check the produced binary is ARM64
        shell: pwsh
        run: |
          $p = 'build\LdacA2dp\ARM64\Release\LdacA2dp\LdacA2dp.sys'
          if (-not (Test-Path $p)) { throw "no $p" }
          $fs = [IO.File]::OpenRead($p); $br = New-Object IO.BinaryReader $fs
          if ($br.ReadUInt16() -ne 0x5A4D) { throw 'not a PE file' }
          $fs.Position = 0x3C; $pe = $br.ReadUInt32(); $fs.Position = $pe
          if ($br.ReadUInt32() -ne 0x00004550) { throw 'no PE signature' }
          $machine = $br.ReadUInt16(); $fs.Dispose()
          if ($machine -ne 0xAA64) { throw ("expected ARM64 (0xAA64), got 0x{0:X4}" -f $machine) }
          Write-Host "LdacA2dp.sys is ARM64 (Machine 0xAA64)"
      - uses: actions/upload-artifact@v4
        with:
          name: LdacA2dp-driver-ARM64
          path: build/LdacA2dp/ARM64/Release/LdacA2dp/*
